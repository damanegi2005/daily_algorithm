name: Daily algorithm commit

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 KST on following day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate today's solution
        run: python3 generate.py
      - name: Commit and push
        run: |
          git config user.name 'damanegi2005'
          git config user.email '211348392+damanegi2005@users.noreply.github.com'
          git add solutions/
          if git diff --cached --quiet; then
            echo "Today's file already exists"
            exit 0
          fi
          git commit -m "solve: $(TZ=Asia/Seoul date +%F)"
          git push
